<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOS Archive — BDO-AOS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root {
  --ink: #0a0d12;
  --panel: #10141b;
  --panel-2: #141923;
  --line: #1f2530;
  --line-bright: #2a3140;
  --paper: #e8ecf1;
  --paper-dim: #aab2c0;
  --steel: #5b6573;
  --signal: #ff5d3a;
  --signal-dim: #b0432a;
  --na: #4f9dff;
  --eu: #ff8a3d;
  --win: #4fd896;
  --loss: #ff6b6b;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--ink);
  background-image:
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(255,93,58,0.08), transparent 60%),
    radial-gradient(ellipse 700px 400px at 100% 0%, rgba(79,157,255,0.05), transparent 60%);
  color: var(--paper);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

::selection { background: var(--signal); color: var(--ink); }

/* ============ HEADER ============ */
header.top {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10,13,18,0.88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.top-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-shrink: 0;
}

.brand .mark {
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.01em;
}

.brand .mark .accent { color: var(--signal); }

.brand .sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--steel);
}

.region-switch {
  display: flex;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}

.region-switch button {
  appearance: none;
  background: transparent;
  border: none;
  color: var(--steel);
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 600;
  font-size: 12.5px;
  letter-spacing: 0.04em;
  padding: 7px 16px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.region-switch button:hover { color: var(--paper); }

.region-switch button.active[data-region="NA"] {
  background: var(--na);
  color: #06121f;
}
.region-switch button.active[data-region="EU"] {
  background: var(--eu);
  color: #1f1006;
}

/* ============ SEASON RAIL ============ */
.season-rail-wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 24px 0;
}

.season-rail {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.season-rail::-webkit-scrollbar { display: none; }

.season-tab {
  appearance: none;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--steel);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  padding: 9px 18px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
  flex-shrink: 0;
}

.season-tab:hover:not(:disabled) {
  border-color: var(--signal-dim);
  color: var(--paper);
}

.season-tab.active {
  background: var(--signal);
  border-color: var(--signal);
  color: var(--ink);
  font-weight: 700;
}

.season-tab:disabled {
  opacity: 0.28;
  cursor: not-allowed;
}

/* ============ PAGE BODY ============ */
.page {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 24px 100px;
}

.meta-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin: 28px 0 24px;
  flex-wrap: wrap;
}

.meta-row h1 {
  font-size: clamp(26px, 4vw, 36px);
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}

.meta-row .snapshot {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  color: var(--steel);
  letter-spacing: 0.02em;
}

.meta-row .snapshot strong { color: var(--paper-dim); font-weight: 500; }

/* ============ CHAMPION SPOTLIGHT ============ */
.spotlight {
  position: relative;
  border: 1px solid var(--line-bright);
  border-radius: 16px;
  background: linear-gradient(135deg, var(--panel-2), var(--panel));
  padding: 28px 32px;
  margin-bottom: 28px;
  overflow: hidden;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 28px;
}

.spotlight::before {
  content: '';
  position: absolute;
  top: -40%;
  right: -10%;
  width: 320px;
  height: 320px;
  background: radial-gradient(circle, rgba(255,93,58,0.16), transparent 70%);
  pointer-events: none;
}

.spotlight .rank-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  color: var(--signal);
  letter-spacing: 0.1em;
  border: 1px solid var(--signal-dim);
  border-radius: 8px;
  padding: 10px 14px;
  text-align: center;
  line-height: 1.3;
}
.spotlight .rank-badge .num { display: block; font-size: 26px; line-height: 1; margin-bottom: 2px; }

.spotlight .who { min-width: 0; }
.spotlight .who .name {
  font-size: clamp(22px, 3vw, 30px);
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.spotlight .who .class-line {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--paper-dim);
  display: flex;
  align-items: center;
  gap: 8px;
}
.spotlight .who .class-line .class-icon {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  object-fit: cover;
  border: 1px solid var(--line-bright);
  flex-shrink: 0;
}
.spotlight .who .class-line .awk { color: var(--steel); margin-left: 2px; }

@media (max-width: 640px) {
  .spotlight .who .class-line { justify-content: center; }
}

.spotlight .stat-block {
  text-align: right;
}
.spotlight .stat-block .elo {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700;
  font-size: clamp(32px, 5vw, 48px);
  line-height: 1;
  color: var(--signal);
  letter-spacing: -0.02em;
}
.spotlight .stat-block .elo-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--steel);
  margin-top: 2px;
}
.spotlight .stat-block .wr {
  margin-top: 8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--win);
}

@media (max-width: 640px) {
  .spotlight { grid-template-columns: 1fr; text-align: center; gap: 14px; padding: 24px 20px; }
  .spotlight .stat-block { text-align: center; }
  .spotlight .who .name { white-space: normal; }
}

/* ============ ANALYTICS ============ */
.analytics-wrap {
  margin-bottom: 32px;
}

.analytics-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 16px;
}

.analytics-heading h2 {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--paper-dim);
  margin: 0;
}

.analytics-heading .sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--steel);
}

.analytics-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

@media (max-width: 900px) {
  .analytics-grid { grid-template-columns: 1fr; }
}

.stat-card {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
  padding: 20px 22px 22px;
}

.stat-card .stat-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--steel);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
}

.stat-card .stat-title .accent-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--signal);
  display: inline-block;
  margin-right: 8px;
  flex-shrink: 0;
}

.bar-row {
  margin-bottom: 14px;
}
.bar-row:last-child { margin-bottom: 0; }

.bar-row .bar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
}

.bar-row .bar-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 500;
  color: var(--paper-dim);
  overflow: hidden;
  min-width: 0;
}
.bar-row .bar-label img {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  flex-shrink: 0;
  object-fit: cover;
}
.bar-row .bar-label span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bar-row .bar-value {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--paper-dim);
  text-align: right;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.bar-row .bar-track {
  height: 5px;
  background: var(--line);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}
.bar-row .bar-fill {
  height: 100%;
  border-radius: 4px;
  background: var(--line-bright);
}
.bar-row.rank-1 .bar-fill { background: var(--signal); }
.bar-row.rank-1 .bar-label { color: var(--paper); font-weight: 600; }
.bar-row.rank-1 .bar-value { color: var(--signal); }

.stat-empty {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--steel);
  padding: 20px 0;
  text-align: center;
}

/* ============ TOOLBAR ============ */
.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.toolbar input[type="search"] {
  flex: 1;
  min-width: 180px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--paper);
  padding: 11px 16px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13.5px;
  border-radius: 10px;
  outline: none;
  transition: border-color 0.15s ease;
}
.toolbar input[type="search"]::placeholder { color: var(--steel); }
.toolbar input[type="search"]:focus { border-color: var(--signal-dim); }

.toolbar select {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--paper);
  padding: 11px 14px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  border-radius: 10px;
  outline: none;
  cursor: pointer;
}

/* ============ TABLE ============ */
.table-frame {
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: var(--panel);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

thead th {
  text-align: left;
  padding: 13px 18px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--steel);
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: color 0.15s ease;
}
thead th:hover { color: var(--paper); }
thead th.sorted-asc, thead th.sorted-desc { color: var(--signal); }
thead th.sorted-asc::after { content: ' \2191'; }
thead th.sorted-desc::after { content: ' \2193'; }

tbody tr {
  border-bottom: 1px solid var(--line);
  transition: background 0.1s ease;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(255,93,58,0.05); }

tbody td {
  padding: 11px 18px;
  vertical-align: middle;
}

td.rank {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 600;
  font-size: 13.5px;
  color: var(--steel);
  width: 48px;
}
tr[data-rank="1"] td.rank,
tr[data-rank="2"] td.rank,
tr[data-rank="3"] td.rank {
  color: var(--signal);
}

td.player-name {
  font-weight: 600;
  color: var(--paper);
}

.class-cell {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  color: var(--paper-dim);
}
.class-cell .class-icon {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
  border: 1px solid var(--line);
}
.class-cell .class-text { display: flex; align-items: baseline; gap: 6px; }
.class-cell .awk {
  font-size: 10.5px;
  color: var(--steel);
}

td.winrate { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
.wr-wrap { display: flex; align-items: center; gap: 9px; }
.wr-track {
  width: 56px;
  height: 4px;
  background: var(--line);
  border-radius: 3px;
  overflow: hidden;
}
.wr-fill { height: 100%; background: var(--win); }

td.wld {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  color: var(--steel);
  font-variant-numeric: tabular-nums;
}
.w { color: var(--win); }
.l { color: var(--loss); }

td.elo {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700;
  color: var(--paper);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.empty-state {
  padding: 64px 24px;
  text-align: center;
  color: var(--steel);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13.5px;
}

footer.bottom {
  text-align: center;
  margin-top: 40px;
  color: var(--steel);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

@media (max-width: 700px) {
  thead th:nth-child(3), tbody td:nth-child(3) { display: none; }
  .toolbar { flex-direction: column; }
  .top-inner { flex-wrap: wrap; }
}
</style>
</head>

const ALL_SEASONS = ["Season 1","Season 2","Season 3","Season 4","Season 5","Season 6","Season 7","Season 8"];

let state = {
  region: "NA",
  season: "Season 8",
  sortKey: "rank",
  sortDir: "asc",
  search: "",
  classFilter: ""
};

function getDataset() {
  return DATA[state.region + "|" + state.season] || null;
}

function renderSeasonRow() {
  const row = document.getElementById('seasonRow');
  row.innerHTML = '';
  ALL_SEASONS.forEach(season => {
    const has = !!DATA[state.region + "|" + season];
    const btn = document.createElement('button');
    btn.className = 'season-tab' + (season === state.season ? ' active' : '');
    btn.textContent = season.replace('Season ', 'S');
    btn.disabled = !has;
    if (has) {
      btn.addEventListener('click', () => {
        state.season = season;
        state.sortKey = 'rank'; state.sortDir = 'asc';
        renderAll();
      });
    }
    row.appendChild(btn);
  });
}

function renderMeta() {
  const ds = getDataset();
  const meta = document.getElementById('metaLine');
  const title = document.getElementById('pageTitle');
  title.textContent = state.region + ' \u2014 ' + state.season;
  if (!ds) {
    meta.innerHTML = '';
    return;
  }
  meta.innerHTML = `Top <strong>${ds.players.length}</strong> &middot; snapshot <strong>${ds.date}</strong>`;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderSpotlight() {
  const ds = getDataset();
  const slot = document.getElementById('spotlightSlot');
  if (!ds || !ds.players.length) { slot.innerHTML = ''; return; }
  const p = ds.players.find(x => x.rank === 1) || ds.players[0];
  slot.innerHTML = `
    <div class="spotlight">
      <div class="rank-badge"><span class="num">#1</span>CHAMPION</div>
      <div class="who">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="class-line">${CLASS_ICONS[p.class] ? `<img class="class-icon" src="${CLASS_ICONS[p.class]}" alt="${escapeHtml(p.class)}">` : ''}${escapeHtml(p.class)}<span class="awk">${p.awakening ? ' &middot; ' + escapeHtml(p.awakening) : ''}</span></div>
      </div>
      <div class="stat-block">
        <div class="elo">${p.elo.toLocaleString()}</div>
        <div class="elo-label">ELO score</div>
        <div class="wr">${p.winrate.toFixed(2)}% WR &middot; ${p.win}W/${p.loss}L</div>
      </div>
    </div>
  `;
}

function computeClassStats(players) {
  const byClass = {};
  players.forEach(p => {
    if (!byClass[p.class]) {
      byClass[p.class] = { class: p.class, count: 0, eloSum: 0, win: 0, loss: 0 };
    }
    const c = byClass[p.class];
    c.count += 1;
    c.eloSum += p.elo;
    c.win += p.win;
    c.loss += p.loss;
  });
  return Object.values(byClass).map(c => ({
    class: c.class,
    count: c.count,
    avgElo: c.eloSum / c.count,
    weightedWr: (c.win + c.loss) > 0 ? (c.win / (c.win + c.loss)) * 100 : 0
  }));
}

function barRowsHtml(rows, valueFn, formatFn, maxValue) {
  return rows.map((r, i) => {
    const val = valueFn(r);
    const pct = maxValue > 0 ? Math.max((val / maxValue) * 100, 3) : 3;
    const icon = CLASS_ICONS[r.class];
    return `
      <div class="bar-row${i === 0 ? ' rank-1' : ''}">
        <div class="bar-top">
          <div class="bar-label">${icon ? `<img src="${icon}" alt="${escapeHtml(r.class)}">` : ''}<span>${escapeHtml(r.class)}</span></div>
          <div class="bar-value">${formatFn(val)}</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join('');
}

function renderAnalytics() {
  const ds = getDataset();
  const slot = document.getElementById('analyticsSlot');
  if (!ds || !ds.players.length) { slot.innerHTML = ''; return; }

  const stats = computeClassStats(ds.players);

  const bySpread = [...stats].sort((a, b) => b.count - a.count).slice(0, 10);
  const byAvgElo = [...stats].sort((a, b) => b.avgElo - a.avgElo).slice(0, 10);
  const byWr = [...stats].sort((a, b) => b.weightedWr - a.weightedWr).slice(0, 10);

  const maxSpread = bySpread.length ? bySpread[0].count : 0;
  const maxAvgElo = byAvgElo.length ? byAvgElo[0].avgElo : 0;
  const maxWr = byWr.length ? byWr[0].weightedWr : 0;

  slot.innerHTML = `
    <div class="analytics-wrap">
      <div class="analytics-heading">
        <h2>Class analytics</h2>
        <div class="sub">Top 10 of ${ds.players.length} &middot; ${state.region} ${state.season}</div>
      </div>
      <div class="analytics-grid">
        <div class="stat-card">
          <div class="stat-title"><span class="accent-dot"></span>Class spread</div>
          ${bySpread.length ? barRowsHtml(bySpread, r => r.count, v => v, maxSpread) : '<div class="stat-empty">No data</div>'}
        </div>
        <div class="stat-card">
          <div class="stat-title"><span class="accent-dot"></span>Avg rating</div>
          ${byAvgElo.length ? barRowsHtml(byAvgElo, r => r.avgElo, v => Math.round(v).toLocaleString(), maxAvgElo) : '<div class="stat-empty">No data</div>'}
        </div>
        <div class="stat-card">
          <div class="stat-title"><span class="accent-dot"></span>Weighted win rate</div>
          ${byWr.length ? barRowsHtml(byWr, r => r.weightedWr, v => v.toFixed(1) + '%', maxWr) : '<div class="stat-empty">No data</div>'}
        </div>
      </div>
    </div>
  `;
}

function populateClassFilter() {
  const ds = getDataset();
  const sel = document.getElementById('classFilter');
  const current = state.classFilter;
  sel.innerHTML = '<option value="">All classes</option>';
  if (!ds) return;
  const classes = [...new Set(ds.players.map(p => p.class))].sort();
  classes.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    if (c === current) opt.selected = true;
    sel.appendChild(opt);
  });
}

function sortPlayers(players) {
  const key = state.sortKey;
  const dir = state.sortDir === 'asc' ? 1 : -1;
  return [...players].sort((a, b) => {
    let av, bv;
    if (key === 'wld') { av = a.win; bv = b.win; }
    else if (key === 'name') { av = a.name.toLowerCase(); bv = b.name.toLowerCase(); }
    else if (key === 'class') { av = a.class.toLowerCase(); bv = b.class.toLowerCase(); }
    else { av = a[key]; bv = b[key]; }
    if (typeof av === 'string') return av.localeCompare(bv) * dir;
    return (av - bv) * dir;
  });
}

function renderTable() {
  const ds = getDataset();
  const tbody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');
  tbody.innerHTML = '';

  if (!ds) {
    document.getElementById('leaderboardTable').style.display = 'none';
    emptyState.style.display = 'block';
    emptyState.textContent = 'This season has not been archived for this region.';
    return;
  }

  let players = ds.players;
  if (state.search) {
    const q = state.search.toLowerCase();
    players = players.filter(p => p.name.toLowerCase().includes(q) || p.class.toLowerCase().includes(q));
  }
  if (state.classFilter) {
    players = players.filter(p => p.class === state.classFilter);
  }
  players = sortPlayers(players);

  document.getElementById('leaderboardTable').style.display = '';
  if (players.length === 0) {
    emptyState.style.display = 'block';
    emptyState.textContent = 'No champions match that search.';
    return;
  }
  emptyState.style.display = 'none';

  players.forEach(p => {
    const tr = document.createElement('tr');
    tr.dataset.rank = p.rank;
    tr.innerHTML = `
      <td class="rank">${p.rank}</td>
      <td class="player-name">${escapeHtml(p.name)}</td>
      <td><div class="class-cell">${CLASS_ICONS[p.class] ? `<img class="class-icon" src="${CLASS_ICONS[p.class]}" alt="${escapeHtml(p.class)}">` : ''}<span class="class-text">${escapeHtml(p.class)}<span class="awk">${p.awakening ? escapeHtml(p.awakening) : ''}</span></span></div></td>
      <td class="winrate">
        <div class="wr-wrap">
          <span>${p.winrate.toFixed(2)}%</span>
          <div class="wr-track"><div class="wr-fill" style="width:${Math.min(p.winrate,100)}%"></div></div>
        </div>
      </td>
      <td class="wld"><span class="w">${p.win}W</span> / ${p.draw}D / <span class="l">${p.loss}L</span></td>
      <td class="elo">${p.elo.toLocaleString()}</td>
    `;
    tbody.appendChild(tr);
  });
}

function updateSortHeaders() {
  document.querySelectorAll('th[data-key]').forEach(th => {
    th.classList.remove('sorted-asc', 'sorted-desc');
    if (th.dataset.key === state.sortKey) {
      th.classList.add(state.sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
    }
  });
}

function renderAll() {
  renderSeasonRow();
  renderMeta();
  renderSpotlight();
  renderAnalytics();
  populateClassFilter();
  renderTable();
  updateSortHeaders();
}

document.getElementById('regionToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-region]');
  if (!btn) return;
  document.querySelectorAll('#regionToggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.region = btn.dataset.region;
  if (!DATA[state.region + "|" + state.season]) {
    for (let i = ALL_SEASONS.length - 1; i >= 0; i--) {
      if (DATA[state.region + "|" + ALL_SEASONS[i]]) { state.season = ALL_SEASONS[i]; break; }
    }
  }
  renderAll();
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  renderTable();
});

document.getElementById('classFilter').addEventListener('change', (e) => {
  state.classFilter = e.target.value;
  renderTable();
});

document.querySelectorAll('th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (state.sortKey === key) {
      state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      state.sortKey = key;
      state.sortDir = key === 'rank' ? 'asc' : 'desc';
    }
    renderTable();
    updateSortHeaders();
  });
});

renderAll();
</script>
</body>
</html>
